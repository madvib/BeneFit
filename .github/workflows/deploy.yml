name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  migrate:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run D1 migrations
        run: pnpm --filter @bene/gateway user_auth:migrate:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 3
      matrix:
        worker:
          - { name: gateway, path: apps/gateway }
          - { name: web, path: apps/web }
          - { name: user-hub, path: apps/actors/user-hub }
          - { name: workout-session, path: apps/actors/workout-session }
          - { name: ai, path: apps/services/ai }
          - { name: integrations, path: apps/services/integrations }
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm nx build ${{ matrix.worker.name }}

      - name: Deploy ${{ matrix.worker.name }}
        run: pnpm wrangler deploy --config ${{ matrix.worker.path }}/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
